[project]
name = "atlas"
version = "0.0.1"
description = "Registry of cells and their capabilities. Source of truth for which cells exist and what each can do, expressed as capability tags."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
atlas = "atlas.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true
